name: Build and Deploy

on: 
  push:
    branches: [ main ]
  
  workflow_dispatch:


jobs:
  buildnpush:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: frontend
            context: ./frontend
            image: thenoosh/sna-fend-img

          - name: backend
            context: ./backend
            image: thenoosh/sna-bend-img

          - name: nginx
            context: ./nginx
            image: thenoosh/sna-nx-img

    steps:
      - name: Repository Checkout
        uses: actions/checkout@v4

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_ACTIONS_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACTIONS_PAT }}

      - name: Docker Build Push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.sha }}

  deploy:
    needs: buildnpush
    runs-on: ubuntu-latest

    steps:
      - name: Deploying
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: "13.207.38.154"
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/ubuntu/study-notes-app
            docker compose pull
            docker compose up -d
         
